<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serena</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
      background: #ffffff;
      font-family: sans-serif;
    }

    /* Scroll container for pinning */
    .scroll-container {
      position: relative;
    }

    /* G CONTAINER - Full viewport grid like gufram.it */
    .g-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: white;
    }

    /* FLOATING OBJECTS — gufram.it style */
    .floating {
      position: absolute;
      object-fit: contain;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    /* Next section */
    .next-section {
      width: 100vw;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 100;
    }

    .next-section h2 {
      font-size: 3rem;
      color: #333;
      font-weight: 300;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>

  <div class="scroll-container">
    <!-- G CONTAINER - Gufram-style floating animation -->
    <div class="g-container">
      <img class="floating" src="images/obj1.png" />
      <img class="floating" src="images/obj2.png" />
      <img class="floating" src="images/obj3.png" />
      <img class="floating" src="images/obj4.png" />
      <img class="floating" src="images/obj5.png" />
      <img class="floating" src="images/obj6.png" />
      <img class="floating" src="images/obj7.png" />
      <img class="floating" src="images/obj8.png" />
    </div>

    <!-- Next Section -->
    <section class="next-section">
      <h2>Next Section</h2>
    </section>
  </div>

  <!-- GSAP with ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    /* GUFRAM-STYLE CONTINUOUS FLOATING ANIMATION */
    const items = gsap.utils.toArray(".floating");
    const container = document.querySelector('.g-container');

    // Grid configuration - spread items across viewport
    const cols = 4;
    const rows = Math.ceil(items.length / cols);
    const cellWidth = window.innerWidth / cols;
    const cellHeight = window.innerHeight / rows;

    // Store base positions and scales for scroll animation
    const itemData = [];

    // Random float function for organic movement
    function randomFloat(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Initialize and animate each floating item
    items.forEach((el, index) => {
      // Grid position
      const col = index % cols;
      const row = Math.floor(index / cols);
      
      // Base position in grid cell (centered with offset)
      const baseX = col * cellWidth + cellWidth * 0.1;
      const baseY = row * cellHeight + cellHeight * 0.1;
      
      // Random size variation (like gufram - different sized objects)
      const size = randomFloat(150, 280);
      
      // Random initial offset within cell
      const offsetX = randomFloat(-30, 30);
      const offsetY = randomFloat(-30, 30);
      
      // Random depth (z-index and scale for layering effect)
      const depth = randomFloat(0.7, 1.1);
      const zIndex = Math.floor(depth * 10);

      // Store data for scroll animation
      itemData.push({
        el,
        baseX,
        baseY,
        offsetX,
        offsetY,
        depth,
        size
      });
      
      // Set initial styles
      gsap.set(el, {
        width: size,
        height: 'auto',
        x: baseX + offsetX,
        y: baseY + offsetY,
        scale: depth,
        zIndex: zIndex,
        opacity: 0
      });

      // Fade in with stagger
      gsap.to(el, {
        opacity: 1,
        duration: 1.2,
        delay: index * 0.1,
        ease: "power2.out"
      });

      // Start the continuous floating animation
      floatAnimation(el, baseX, baseY, depth);
    });

    // Continuous organic floating movement - THE GUFRAM EFFECT
    function floatAnimation(el, baseX, baseY, baseScale) {
      // Random movement parameters for organic feel
      const driftRange = 60; // How far items drift
      const duration = randomFloat(8, 15); // Slow, dreamy movement
      
      // Random target position (drifting from base)
      const targetX = baseX + randomFloat(-driftRange, driftRange);
      const targetY = baseY + randomFloat(-driftRange, driftRange);
      
      // Subtle rotation
      const rotation = randomFloat(-8, 8);
      
      // Get current scroll-influenced scale and add subtle pulse
      const scrollScale = gsap.getProperty(el, "scale");
      const targetScale = scrollScale + randomFloat(-0.03, 0.03);

      gsap.to(el, {
        x: targetX,
        y: targetY,
        rotation: rotation,
        scale: Math.max(baseScale * 0.9, Math.min(baseScale * 3, targetScale)),
        duration: duration,
        ease: "sine.inOut",
        onComplete: () => floatAnimation(el, baseX, baseY, baseScale)
      });
    }

    /* SCROLL-TRIGGERED ZOOM EFFECT */
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    // Create scroll-triggered zoom animation
    ScrollTrigger.create({
      trigger: ".g-container",
      start: "top top",
      end: "bottom top",
      pin: true,
      scrub: 1.5,
      onUpdate: (self) => {
        const progress = self.progress;
        
        items.forEach((el, index) => {
          const data = itemData[index];
          
          // Calculate direction from center (for spreading outward)
          const elX = gsap.getProperty(el, "x");
          const elY = gsap.getProperty(el, "y");
          const dirX = (elX - centerX) * progress * 1.5;
          const dirY = (elY - centerY) * progress * 1.5;
          
          // Scale increases as you scroll (zoom in effect)
          const zoomScale = data.depth + (progress * 2.5);
          
          // Opacity fades out as items zoom past
          const opacity = 1 - (progress * 0.8);
          
          gsap.to(el, {
            scale: zoomScale,
            xPercent: dirX * 0.5,
            yPercent: dirY * 0.5,
            opacity: Math.max(0, opacity),
            duration: 0.3,
            ease: "none",
            overwrite: "auto"
          });
        });
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      const newCellWidth = window.innerWidth / cols;
      const newCellHeight = window.innerHeight / rows;
      
      items.forEach((el, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        const baseX = col * newCellWidth + newCellWidth * 0.1;
        const baseY = row * newCellHeight + newCellHeight * 0.1;
        
        itemData[index].baseX = baseX;
        itemData[index].baseY = baseY;
        
        gsap.to(el, {
          x: baseX + randomFloat(-30, 30),
          y: baseY + randomFloat(-30, 30),
          duration: 1,
          ease: "power2.out"
        });
      });
    });
  </script>

</body>
</html>
